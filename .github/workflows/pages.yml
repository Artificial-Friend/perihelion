# Builds the game on every push to main and publishes dist/ to the gh-pages branch,
# which GitHub Pages serves (Settings > Pages > Deploy from a branch > gh-pages / root).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install clang and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm ci
      - run: node build.mjs
      - run: npx tsc -p .
      - name: Physics core parity
        run: node test/parity.mjs test/core-v3.wasm build/core.wasm 2000 --native build/core_native
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
