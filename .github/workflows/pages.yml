# Builds the game and publishes dist/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install clang and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm ci
      - run: npx tsc -p .
      - run: node build.mjs
      - name: Physics core parity
        run: node test/parity.mjs test/core-v3.wasm build/core.wasm 2000 --native build/core_native
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
